# 16 enriched rock songs from the 1980s: enough for both a "Rock" genre
# station and an "80s" decade station (Station::MIN_SONGS = 15). BPM spreads
# 100..130 so both smart-party (>= 115) and smart-focus (<= 110) have songs.
<% 16.times do |i| %>
rock_<%= i %>:
  isrc: ROCK<%= format("%08d", i) %>
  title: Rock Song <%= i %>
  artist: Rock Artist
  album: Rock Album
  image_url: https://example.com/rock.jpg
  duration: 200
  genre: Rock
  release_year: <%= 1980 + (i % 10) %>
  bpm: <%= (100 + i * 2).to_f %>
  deezer_rank: 100000
  enriched_at: 2026-07-01 00:00:00
<% end %>

# A lone genre: below MIN_SONGS, so no station.
jazz_only:
  isrc: JAZZ00000001
  title: Lonely Jazz
  artist: Jazz Artist
  album: Jazz Album
  image_url: https://example.com/jazz.jpg
  duration: 300
  genre: Jazz
  release_year: 1959
  bpm: 90.0
  deezer_rank: 50000
  enriched_at: 2026-07-01 00:00:00

# Not yet enriched: no genre/year/bpm.
unenriched:
  isrc: NEWW00000001
  title: Fresh Import
  artist: New Artist
  album: New Album
  image_url: https://example.com/new.jpg
  duration: 180
