default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    # Everything except karaoke separation. Named explicitly rather than "*"
    # so this worker can never pick up a minutes-long Demucs run — which means
    # any future job on a new queue must be added here or it will never run.
    #
    # solid_queue_recurring is that trap, already sprung once: a recurring
    # entry declared with `command:` (config/recurring.yml's hourly
    # clear_solid_queue_finished_jobs) has no job class to take a queue_as
    # from, so Solid Queue puts it on this queue instead. Nothing listened to
    # it, so from 2026-08-09 one dead job piled up every hour — 310 of them,
    # none claimed — and finished jobs were never pruned.
    - queues: [ default, solid_queue_recurring ]
      threads: 3
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 0.1
    # One thread per process, and by default one process: at most one
    # separation at a time system-wide, which the topology guarantees on top of
    # VocalSeparation's mutex. That mutex is process-local, so KARAOKE_CONCURRENCY
    # is the only thing holding that guarantee up -- raise it and Demucs runs
    # genuinely overlap. Each run wants ~3 of prod's 6 cores and peaks around
    # 1.5GB RSS, so 2 saturates the box and the systemd unit's MemoryMax has to
    # be raised to match or the cgroup gets OOM-killed mid-separation.
    - queues: karaoke
      threads: 1
      processes: <%= ENV.fetch("KARAOKE_CONCURRENCY", 1) %>
      polling_interval: 1

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
