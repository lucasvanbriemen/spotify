[program:music-solid-queue]
; Solid Queue worker, dispatcher, and recurring scheduler for music.ltvb.nl.
command=/var/www/vhosts/ltvb.nl/.rbenv/versions/3.3.8/bin/bundle exec bin/jobs
directory=/var/www/vhosts/ltvb.nl/music.ltvb.nl
user=ltvb
environment=HOME="/var/www/vhosts/ltvb.nl",RAILS_ENV="production"
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/www/vhosts/ltvb.nl/music.ltvb.nl/log/solid_queue.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stopwaitsecs=30
