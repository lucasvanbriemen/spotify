[program:music-kokoro]
; Persistent, localhost-only Kokoro-82M English speech service.
command=/var/www/vhosts/ltvb.nl/music.ltvb.nl/vendor/kokoro/bin/python script/kokoro_server.py
directory=/var/www/vhosts/ltvb.nl/music.ltvb.nl
user=ltvb
environment=HOME="/var/www/vhosts/ltvb.nl",HF_HOME="/var/www/vhosts/ltvb.nl/music.ltvb.nl/storage/kokoro"
autostart=true
autorestart=true
startsecs=20
startretries=5
redirect_stderr=true
stdout_logfile=/var/www/vhosts/ltvb.nl/music.ltvb.nl/log/kokoro.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stopwaitsecs=10
